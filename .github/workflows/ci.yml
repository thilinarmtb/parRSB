      #   run: |
      #     export PARRSB_RSB_ALGO=1
      #     export PARRSB_RSB_MG_FACTOR=4
      #     export PARRSB_VERBOSE_LEVEL=2

      #     cp ${EXAMPLEDIR}/genmap ${CIDIR}/${{ matrix.test }}
      #     cd ${CIDIR}/${{ matrix.test }}

      #     tol=(`cat test.txt | grep tol`); tol=${tol[2]}
      #     ${MPIEXE} -np ${{ matrix.np }} ./genmap --mesh ${{ matrix.test }} \
      #       --tol=${tol} --dump=0 --test=1
  graph:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        np: [1, 2, 3, 4]
      fail-fast: false
    env:
      TESTDIR: ${{ github.workspace }}/build/test
    steps:
      - uses: actions/checkout@v3
      - name: Install apt dependencies
        shell: bash
        run: |
          sudo apt -y update
          sudo apt install -y openmpi-bin libopenmpi-dev
          sudo apt install -y libblas-dev liblapack-dev
          sudo apt install -y build-essential
      - name: Build parRSB and clone tests
        shell: bash
        run: |
          # Build gslib
          git clone https://github.com/Nek5000/gslib.git
          make -C gslib -j4

          # Build parRSB
          export GSLIBPATH=`pwd`/gslib/build/
          make -j4 test
      - name: Test graph laplacian operator
        shell: bash
        run: |
          cd ${TESTDIR}
          ${MPIEXE} -np ${{ matrix.np }} ./parrsb_000_graph_laplacian
      - name: Test graph laplacian eigenvalues
        shell: bash
        run: |
          cd ${TESTDIR}
          ${MPIEXE} -np ${{ matrix.np }} ./parrsb_050_graph_eigenvalues
